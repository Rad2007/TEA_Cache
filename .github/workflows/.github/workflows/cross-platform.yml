name: Tea Cache Cross-Platform Tests

on: [push, workflow_dispatch]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Rust project
        run: cargo build --locked

      - name: Run Rust tests
        run: cargo test --locked