name: Tea Cache Cross-Platform Tests

"on":
  push:
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-24.04
        - windows-latest
        - macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build Rust project
        run: cargo build --locked

      - name: Run Rust tests
        run: cargo test --locked